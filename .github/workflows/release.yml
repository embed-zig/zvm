name: Release

on:
  push:
    tags:
      - "v*"

env:
  ZIG_VERSION: 0.15.2

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check shell scripts
        shell: bash
        run: sh -n install.sh devtools/*.sh test/integration/*.sh

      - name: Verify registry
        shell: bash
        run: ./devtools/verify-registry.sh

      - name: Run tests
        run: zig build test

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          case "$tag" in
            v*) ;;
            *)
              echo "release tag must start with v: $tag" >&2
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        shell: bash
        run: ./devtools/release.sh "${{ steps.release.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: |
            dist/${{ steps.release.outputs.tag }}/zvm-*
            dist/${{ steps.release.outputs.tag }}/install.sh
            dist/${{ steps.release.outputs.tag }}/SHA256SUMS
          fail_on_unmatched_files: true
