name: Release

on:
  push:
    tags:
      - "v*"

env:
  ZIG_VERSION: 0.15.2
  RELEASE_NOTES_MODEL: openai/gpt-4o-mini

permissions:
  contents: write
  models: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check shell scripts
        shell: bash
        run: sh -n install.sh devtools/*.sh test/integration/*.sh

      - name: Verify registry
        shell: bash
        run: ./devtools/verify-registry.sh

      - name: Run tests
        run: zig build test

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          case "$tag" in
            v*) ;;
            *)
              echo "release tag must start with v: $tag" >&2
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          previous_tag="$(git tag --sort=-creatordate --merged "$tag" | awk -v tag="$tag" '$0 != tag { print; exit }')"
          if [ -z "$previous_tag" ]; then
            base_ref="$(git rev-list --max-parents=0 "$tag")"
          else
            base_ref="$previous_tag"
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        shell: bash
        run: ./devtools/release.sh "${{ steps.release.outputs.tag }}"

      - name: Prepare release notes prompt
        shell: bash
        run: |
          set -euo pipefail

          release_tag="${{ steps.release.outputs.tag }}"
          base_ref="${{ steps.release.outputs.base_ref }}"
          head_ref="${{ steps.release.outputs.tag }}"
          context_dir="dist/$release_tag/release-context"
          mkdir -p "$context_dir"

          git log --no-merges --format='- %s (%h)' "$base_ref..$head_ref" >"$context_dir/commits.md"
          git diff --name-status "$base_ref..$head_ref" >"$context_dir/files.txt"
          git diff --stat "$base_ref..$head_ref" >"$context_dir/diff-stat.txt"
          git diff --unified=20 "$base_ref..$head_ref" >"$context_dir/release.diff" || true

          {
            printf 'You are writing the changelog section for zvm, the Zig Version Manager.\n'
            printf 'Write concise, user-facing markdown for this release.\n'
            printf 'Use these sections exactly: "### Highlights", "### Changes", "### Notes".\n'
            printf 'The first non-empty line must be "### Highlights".\n'
            printf 'Do not include install instructions or artifact lists; those are added separately.\n'
            printf 'Do not wrap the response in a markdown code fence.\n'
            printf 'Prioritize behavior visible to zvm users, release reliability, installer behavior, registry changes, and validation coverage.\n'
            printf 'Mention tests only when they explain confidence in a user-visible fix.\n\n'
            printf 'Release: `%s`\n' "$release_tag"
            printf 'Source commit: `%s`\n' "$GITHUB_SHA"
            printf 'Release range: `%s..%s`\n\n' "$base_ref" "$head_ref"
            printf 'Commit log:\n'
            cat "$context_dir/commits.md"
            printf '\nChanged files:\n'
            cat "$context_dir/files.txt"
            printf '\nDiff stat:\n'
            cat "$context_dir/diff-stat.txt"
            printf '\nDiff, truncated if necessary:\n'
            python3 -c 'import pathlib, sys; data = pathlib.Path(sys.argv[1]).read_text(errors="replace"); limit = 120000; sys.stdout.write(data if len(data) <= limit else data[:limit] + "\n\n[diff truncated]\n")' "$context_dir/release.diff"
          } >"$context_dir/changelog.prompt.md"

      - name: Generate release changelog
        id: release_changelog
        uses: actions/ai-inference@v1
        with:
          prompt-file: dist/${{ steps.release.outputs.tag }}/release-context/changelog.prompt.md
          model: ${{ env.RELEASE_NOTES_MODEL }}
          max-tokens: 1200

      - name: Write release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_CHANGELOG_FILE: ${{ steps.release_changelog.outputs.response-file }}
        run: |
          set -euo pipefail

          notes="dist/$RELEASE_TAG/RELEASE_NOTES.md"
          changelog="dist/$RELEASE_TAG/AI_CHANGELOG.md"
          python3 - "$RELEASE_CHANGELOG_FILE" "$changelog" <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          notes = source.read_text(errors="replace").strip()
          notes = re.sub(r"\A```(?:markdown|md)?\s*\n", "", notes, flags=re.IGNORECASE)
          notes = re.sub(r"\n```\s*\Z", "", notes).strip()
          target.write_text(notes + "\n")
          PY

          if [ ! -s "$changelog" ]; then
            echo "AI release changelog output is empty" >&2
            exit 1
          fi

          cat > "$notes" <<EOF
          ## Install

          Install this release with the bootstrap script:

          \`\`\`sh
          curl -fsSL https://github.com/embed-zig/zvm/releases/download/$RELEASE_TAG/install.sh | sh
          \`\`\`

          The installer adds zvm to existing shell startup files when possible.

          Restart your shell, or run this for the current shell session:

          \`\`\`sh
          export PATH="\$HOME/.zvm/bin:\$PATH"
          \`\`\`

          Verify the installation:

          \`\`\`sh
          zvm --version
          zvm doctor
          \`\`\`

          ## Manual Install

          Download the archive for your platform, verify it with \`SHA256SUMS\`, and place the \`zvm\` binary in \`~/.zvm/bin\`.

          Supported release assets:

          - \`zvm-linux-x86_64.tar.gz\`
          - \`zvm-linux-aarch64.tar.gz\`
          - \`zvm-macos-x86_64.tar.gz\`
          - \`zvm-macos-aarch64.tar.gz\`
          - \`zvm-windows-x86_64.tar.gz\`
          - \`zvm-windows-aarch64.tar.gz\`

          The bootstrap script verifies checksums automatically.

          ## Changelog
          EOF

          cat "$changelog" >> "$notes"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body_path: dist/${{ steps.release.outputs.tag }}/RELEASE_NOTES.md
          files: |
            dist/${{ steps.release.outputs.tag }}/zvm-*
            dist/${{ steps.release.outputs.tag }}/install.sh
            dist/${{ steps.release.outputs.tag }}/SHA256SUMS
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Update GitHub Release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file "dist/$RELEASE_TAG/RELEASE_NOTES.md"
